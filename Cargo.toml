[package]
name = "lkprofessionals-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "compression-zstd", "fs", "trace"] }
askama = "0.14"
askama_axum = "0.4"
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower-sessions = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5.3"
rand_core = "0.10.1"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate"
] }
dotenvy = "0.15"
password-hash = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
