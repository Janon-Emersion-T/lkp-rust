name: Deploy LKProfessionals Rust Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory /var/www/lkprofessionals/app
            cd /var/www/lkprofessionals/app
            git pull origin main
            sudo -u lkprofessionals -H bash -lc 'cd /var/www/lkprofessionals/app && source ~/.cargo/env && npm install && ~/.cargo/bin/just build'
            systemctl restart lkprofessionals
            systemctl status lkprofessionals --no-pager
