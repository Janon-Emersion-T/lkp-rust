{% extends "base.html" %}

{% block title %}Contact LKProfessionals (Pvt) Ltd.{% endblock %}

{% block content %}
<section class="bg-slate-950 px-6 py-24">
    <div class="mx-auto max-w-4xl rounded-3xl bg-white p-8 text-slate-900 shadow-2xl">
        <h1 class="text-3xl font-bold">Contact LKProfessionals (Pvt) Ltd.</h1>
        <p class="mt-3 text-slate-600">Send your message. We will respond after reviewing your requirement.</p>

        <form action="/contact" method="post" class="mt-8 grid gap-5">
            <input name="name" required placeholder="Your Name" class="rounded-xl border px-4 py-3">
            <input name="email" type="email" required placeholder="Email Address" class="rounded-xl border px-4 py-3">
            <input name="phone" placeholder="Phone / WhatsApp" class="rounded-xl border px-4 py-3">
            <input name="company" placeholder="Company Name" class="rounded-xl border px-4 py-3">
            <input name="subject" required placeholder="Subject" class="rounded-xl border px-4 py-3">
            <textarea name="message" required rows="6" placeholder="Message" class="rounded-xl border px-4 py-3"></textarea>

            <button class="rounded-xl bg-cyan-500 px-6 py-3 font-bold text-white hover:bg-cyan-600">
                Send Message
            </button>
        </form>
    </div>
</section>
{% endblock %}
