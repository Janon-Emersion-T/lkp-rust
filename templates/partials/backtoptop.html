<!-- Back To Top Button -->
<button
    id="backToTop"
    class="fixed bottom-6 right-6 z-50 hidden rounded-full bg-cyan-400 p-4 text-slate-950 shadow-lg transition hover:scale-110 hover:bg-cyan-300"
    aria-label="Back to Top"
>
    ↑
</button>

<script>
    const backToTop = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            backToTop.classList.remove('hidden');
        } else {
            backToTop.classList.add('hidden');
        }
    });

    backToTop.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>
