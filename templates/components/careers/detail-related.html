{% if related.len() > 0 %}
<section class="bg-slate-50 px-6 py-24">
    <div class="mx-auto max-w-7xl">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
            <div class="max-w-3xl">
                <p class="text-sm font-black uppercase tracking-[0.24em] text-cyan-700">Related Roles</p>
                <h2 class="mt-3 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
                    Other opportunities at LKProfessionals.
                </h2>
            </div>
            <a href="/careers" class="text-sm font-black text-cyan-700 transition hover:text-cyan-900">
                View all roles
            </a>
        </div>

        <div class="mt-12 grid gap-6 lg:grid-cols-3">
            {% for role in related %}
            <article class="service-card group bg-white">
                <div class="flex flex-wrap items-center gap-2 text-[11px] font-black uppercase tracking-[0.22em] text-cyan-700">
                    <span>{{ role.team }}</span>
                    <span class="text-slate-300">•</span>
                    <span class="text-slate-500">{{ role.workplace_mode }}</span>
                </div>
                <h3 class="mt-4 text-2xl font-black tracking-tight text-slate-950">{{ role.title }}</h3>
                <p class="mt-3 text-sm font-semibold text-slate-600">{{ role.location }} · {{ role.employment_type }}</p>
                <p class="mt-4 text-sm leading-7 text-slate-600">{{ role.summary }}</p>
                <a href="{{ role.public_url }}" class="mt-8 inline-flex items-center gap-2 text-sm font-black text-slate-950">
                    Explore role
                    <i class="fa-solid fa-arrow-right text-cyan-600 transition group-hover:translate-x-1"></i>
                </a>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
