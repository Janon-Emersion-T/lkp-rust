{% if related.len() > 0 %}
<section class="bg-slate-50 px-6 py-24">
    <div class="mx-auto max-w-7xl">
        <div class="max-w-3xl">
            <p class="text-sm font-black uppercase tracking-[0.24em] text-cyan-700">Related Insights</p>
            <h2 class="mt-3 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
                Keep reading from the same knowledge stream.
            </h2>
        </div>

        <div class="mt-12 grid gap-6 md:grid-cols-3">
            {% for item in related %}
            <article class="service-card group bg-white">
                <div class="overflow-hidden rounded-[1.5rem]">
                    <img src="{{ item.cover_image_url }}" alt="{{ item.title }}" loading="lazy" decoding="async" class="h-52 w-full object-cover transition duration-500 group-hover:scale-105" />
                </div>
                <p class="mt-6 text-xs font-black uppercase tracking-[0.22em] text-cyan-700">{{ item.category }}</p>
                <h3 class="mt-3 text-2xl font-black tracking-tight text-slate-950">{{ item.title }}</h3>
                <p class="mt-4 text-sm leading-7 text-slate-600">{{ item.excerpt }}</p>
                <a href="{{ item.public_url }}" class="mt-8 inline-flex items-center gap-2 text-sm font-black text-slate-950">
                    Read article
                    <i class="fa-solid fa-arrow-right text-cyan-600 transition group-hover:translate-x-1"></i>
                </a>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
