<section class="service-shell relative overflow-hidden px-6 py-24 text-white">
    <div class="absolute inset-0 opacity-60">
        <div class="service-orb-left absolute -left-16 top-16 h-72 w-72 rounded-full blur-3xl"></div>
        <div class="service-orb-right absolute right-0 top-0 h-96 w-96 rounded-full blur-3xl"></div>
    </div>

    <div class="relative mx-auto max-w-7xl">
        <div class="grid gap-10 lg:grid-cols-[1.1fr_0.9fr] lg:items-end">
            <div>
                <nav aria-label="Breadcrumb" class="text-sm text-slate-300">
                    <ol class="flex flex-wrap items-center gap-2">
                        <li><a href="/" class="transition hover:text-white">Home</a></li>
                        <li aria-hidden="true" class="text-slate-500">/</li>
                        <li aria-current="page" class="font-bold text-white">{{ archive_label }}</li>
                    </ol>
                </nav>
                <p class="service-pill">{{ archive_label }}</p>
                <h1 class="mt-6 max-w-4xl text-4xl font-black tracking-tight md:text-6xl">
                    {{ archive_heading }}
                </h1>
                <p class="mt-6 max-w-3xl text-lg leading-8 text-slate-300">
                    {{ archive_description }}
                </p>
            </div>

            <div class="service-panel">
                <p class="text-xs font-black uppercase tracking-[0.28em] text-cyan-300">Insights Snapshot</p>
                <div class="mt-8 grid gap-4 sm:grid-cols-2">
                    {% for metric in snapshot_metrics %}
                    <div class="rounded-[1.75rem] border border-white/10 bg-white/5 px-6 py-5 shadow-[0_20px_60px_rgba(15,23,42,0.28)] backdrop-blur">
                        <p class="text-3xl font-black text-white md:text-4xl">{{ metric.value }}</p>
                        <p class="mt-2 text-xs font-black uppercase tracking-[0.26em] text-slate-300">{{ metric.label }}</p>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
