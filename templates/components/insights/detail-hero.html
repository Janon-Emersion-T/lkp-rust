<section class="service-shell relative overflow-hidden px-6 py-24 text-white">
    <div class="absolute inset-0 opacity-60">
        <div class="service-orb-left absolute -left-16 top-16 h-72 w-72 rounded-full blur-3xl"></div>
        <div class="service-orb-right absolute right-0 top-0 h-96 w-96 rounded-full blur-3xl"></div>
    </div>

    <div class="relative mx-auto max-w-7xl">
        <nav aria-label="Breadcrumb" class="text-sm text-slate-300">
            <ol class="flex flex-wrap items-center gap-2">
                <li><a href="/" class="transition hover:text-white">Home</a></li>
                <li aria-hidden="true" class="text-slate-500">/</li>
                <li><a href="/insights" class="transition hover:text-white">Insights</a></li>
                <li aria-hidden="true" class="text-slate-500">/</li>
                <li aria-current="page" class="font-bold text-white">{{ insight.title }}</li>
            </ol>
        </nav>

        <div class="mt-8 grid gap-10 lg:grid-cols-[1.05fr_0.95fr] lg:items-center">
            <div>
                <p class="service-pill">{{ insight.category }}</p>
                <h1 class="mt-6 max-w-4xl text-4xl font-black tracking-tight md:text-6xl">
                    {{ insight.title }}
                </h1>
                <p class="mt-6 max-w-3xl text-lg leading-8 text-slate-300">
                    {{ insight.excerpt }}
                </p>
                <div class="mt-10 flex flex-wrap gap-3">
                    <span class="service-mini-panel">{{ insight.author }}</span>
                    <span class="service-mini-panel">{{ insight.reading_time_label }}</span>
                    <span class="service-mini-panel">{{ insight.published_date_label }}</span>
                </div>
            </div>

            <div class="overflow-hidden rounded-[2rem] border border-white/10 shadow-[0_28px_70px_rgba(2,6,23,0.36)]">
                <img src="{{ insight.cover_image_url }}" alt="Cover image for {{ insight.title }}" loading="eager" fetchpriority="high" decoding="async" width="1200" height="720" class="h-full min-h-[22rem] w-full object-cover" />
            </div>
        </div>
    </div>
</section>
