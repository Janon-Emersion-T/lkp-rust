<section class="bg-white px-6 py-24">
    <div class="mx-auto grid max-w-7xl gap-14 lg:grid-cols-[0.75fr_1.25fr]">
        <div>
            <p class="text-sm font-black uppercase tracking-[0.24em] text-cyan-700">Article Context</p>
            <div class="mt-6 grid gap-4">
                <div class="rounded-[1.75rem] border border-slate-200 bg-slate-50 p-6">
                    <p class="text-xs font-black uppercase tracking-[0.22em] text-slate-500">Category</p>
                    <p class="mt-3 text-sm leading-7 text-slate-700">{{ insight.category }}</p>
                </div>
                <div class="rounded-[1.75rem] border border-slate-200 bg-slate-50 p-6">
                    <p class="text-xs font-black uppercase tracking-[0.22em] text-slate-500">Author</p>
                    <p class="mt-3 text-sm leading-7 text-slate-700">{{ insight.author }}</p>
                </div>
                <div class="rounded-[1.75rem] border border-slate-200 bg-slate-50 p-6">
                    <p class="text-xs font-black uppercase tracking-[0.22em] text-slate-500">Reading Time</p>
                    <p class="mt-3 text-sm leading-7 text-slate-700">{{ insight.reading_time_label }}</p>
                </div>
            </div>
        </div>

        <article class="rounded-[2rem] border border-slate-200 bg-slate-50 p-8 md:p-10">
            <div class="prose max-w-none prose-headings:text-slate-900 prose-p:text-slate-600 prose-p:leading-8 prose-a:text-cyan-700 prose-strong:text-slate-900">
                {{ insight.content_html|safe }}
            </div>
        </article>
    </div>
</section>
