<section class="bg-slate-950 px-6 py-24 text-white">
    <div class="mx-auto grid max-w-7xl gap-10 lg:grid-cols-[0.85fr_1.15fr]">
        <div>
            <p class="text-sm font-black uppercase tracking-[0.25em] text-cyan-300">FAQ</p>
            <h2 class="mt-4 text-3xl font-black tracking-tight md:text-5xl">
                Common questions about {{ page.title | lower }}.
            </h2>
            <p class="mt-6 max-w-2xl text-sm leading-7 text-slate-300">
                If you need something more specific, we can discuss your use case, existing setup, and the best delivery path directly.
            </p>
        </div>

        <div class="grid gap-5">
            {% for faq in page.faqs %}
            <div class="rounded-[1.75rem] border border-white/10 bg-white/5 p-6">
                <h3 class="text-lg font-black">{{ faq.question }}</h3>
                <p class="mt-3 text-sm leading-7 text-slate-300">{{ faq.answer }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
