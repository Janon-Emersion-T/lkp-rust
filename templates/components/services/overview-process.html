<section class="bg-slate-50 px-6 py-24">
    <div class="mx-auto grid max-w-7xl gap-12 lg:grid-cols-[0.9fr_1.1fr]">
        <div>
            <p class="text-sm font-black uppercase tracking-[0.25em] text-cyan-700">How We Work</p>
            <h2 class="mt-4 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
                One service ecosystem, shaped around clarity and momentum.
            </h2>
            <div class="mt-8 grid gap-4">
                {% for point in proof_points %}
                <div class="rounded-[1.75rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
                    <h3 class="text-lg font-black text-slate-950">{{ point.title }}</h3>
                    <p class="mt-3 text-sm leading-7 text-slate-600">{{ point.description }}</p>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-[0_24px_60px_rgba(15,23,42,0.06)]">
            <p class="text-xs font-black uppercase tracking-[0.28em] text-slate-500">Delivery Flow</p>
            <div class="mt-8 grid gap-6">
                {% for step in process %}
                <div class="grid gap-4 border-b border-slate-200 pb-6 last:border-b-0 last:pb-0 md:grid-cols-[3.5rem_1fr]">
                    <div class="grid h-14 w-14 place-items-center rounded-2xl bg-slate-950 text-lg font-black text-white">
                        0{{ loop.index }}
                    </div>
                    <div>
                        <h3 class="text-xl font-black text-slate-950">{{ step.title }}</h3>
                        <p class="mt-3 text-sm leading-7 text-slate-600">{{ step.description }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
