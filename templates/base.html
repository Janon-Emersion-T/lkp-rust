<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}LKProfessionals (Pvt) Ltd. | IT Services Company in Sri Lanka{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}LKProfessionals (Pvt) Ltd. provides web development, custom software, SEO, digital marketing, hosting, domain, and IT consultation services in Sri Lanka.{% endblock %}">
    <meta name="robots" content="{% block robots %}index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1{% endblock %}">
    <link rel="canonical" href="{% block canonical %}https://lkprofessionals.com/{% endblock %}">

    <meta property="og:site_name" content="LKProfessionals (Pvt) Ltd.">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}LKProfessionals (Pvt) Ltd. | IT Services Company in Sri Lanka{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Reliable IT services, web development, SEO, digital marketing, hosting, domain, and business automation solutions for Sri Lankan and international businesses.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://lkprofessionals.com/{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://lkprofessionals.com/static/images/og/lkprofessionals-og.jpg{% endblock %}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}LKProfessionals (Pvt) Ltd. | IT Services Company in Sri Lanka{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Web development, custom software, SEO, digital marketing, hosting, domain, and IT consultation services by LKProfessionals.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}https://lkprofessionals.com/static/images/og/lkprofessionals-og.jpg{% endblock %}">

    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    {% block structured_data %}{% endblock %}

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .footer-glow {
            animation: footerGlow 8s ease-in-out infinite alternate;
        }

        .footer-glow-delay {
            animation: footerGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes footerGlow {
            from {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 0.35;
            }
            to {
                transform: translate3d(20px, -20px, 0) scale(1.12);
                opacity: 0.65;
            }
        }
    </style>
</head>

<body class="bg-white text-slate-950 antialiased">

    {% include "partials/header.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

</body>
</html>
