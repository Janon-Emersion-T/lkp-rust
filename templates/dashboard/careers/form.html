<section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)] md:p-8">
    <div class="max-w-3xl">
        <p class="text-sm font-black uppercase tracking-[0.24em] text-slate-500">Careers CMS</p>
        <h1 class="mt-3 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
            {% if career.title.len() > 0 %}Refine vacancy details and hiring metadata.{% else %}Create a publish-ready vacancy page.{% endif %}
        </h1>
        <p class="mt-4 text-sm leading-7 text-slate-600">
            This form controls the public vacancy page, careers listing, and the SEO data search engines will read.
        </p>
    </div>

    <form action="{{ action_url }}" method="post" class="mt-8 grid gap-8">
        <div class="grid gap-5 md:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Role title
                <input name="title" required minlength="3" value="{{ career.title }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Slug
                <input name="slug" value="{{ career.slug }}" placeholder="auto-generated-from-title" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-4">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Team
                <input name="team" value="{{ career.team }}" placeholder="Engineering, Growth..." class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Location
                <input name="location" value="{{ career.location }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Workplace mode
                <input name="workplace_mode" value="{{ career.workplace_mode }}" placeholder="Hybrid, Remote-friendly..." class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Employment type
                <input name="employment_type" value="{{ career.employment_type }}" placeholder="Full-time, Contract..." class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <div class="grid gap-5 md:grid-cols-3">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Experience level
                <input name="experience_level" value="{{ career.experience_level }}" placeholder="Junior, Mid-level, Senior..." class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Salary range
                <input name="salary_range" value="{{ career.salary_range }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Sort order
                <input type="number" name="sort_order" value="{{ career.sort_order }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <label class="grid gap-2 text-sm font-bold text-slate-700">
            Summary
            <textarea name="summary" required rows="4" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500">{{ career.summary }}</textarea>
        </label>

        <label class="grid gap-2 text-sm font-bold text-slate-700">
            Description
            <textarea name="description" required rows="9" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500">{{ career.description }}</textarea>
        </label>

        <div class="grid gap-5 lg:grid-cols-3">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Responsibilities
                <textarea name="responsibilities" rows="8" placeholder="One responsibility per line" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500">{{ career.responsibilities }}</textarea>
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Requirements
                <textarea name="requirements" rows="8" placeholder="One requirement per line" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500">{{ career.requirements }}</textarea>
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Benefits
                <textarea name="benefits" rows="8" placeholder="One benefit per line" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500">{{ career.benefits }}</textarea>
            </label>
        </div>

        <div class="grid gap-5 md:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Application email
                <input name="application_email" value="{{ career.application_email }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                External apply URL
                <input name="apply_url" value="{{ career.apply_url }}" placeholder="Leave empty to use the internal apply page" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <div class="grid gap-5 md:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Cover image URL
                <input name="cover_image_url" value="{{ career.cover_image_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                OG image URL
                <input name="og_image_url" value="{{ career.og_image_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <div class="grid gap-5 md:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Meta title
                <input name="meta_title" value="{{ career.meta_title }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Canonical URL
                <input name="canonical_url" value="{{ career.canonical_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <label class="grid gap-2 text-sm font-bold text-slate-700">
            Meta description
            <textarea name="meta_description" rows="4" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-cyan-500">{{ career.meta_description }}</textarea>
        </label>

        <div class="grid gap-4 md:grid-cols-2">
            <label class="flex items-center gap-3 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-5 py-4 text-sm font-bold text-slate-700">
                <input type="checkbox" name="featured" {% if career.featured %}checked{% endif %} class="h-5 w-5 rounded border-slate-300 text-cyan-600" />
                Feature this role
            </label>
            <label class="flex items-center gap-3 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-5 py-4 text-sm font-bold text-slate-700">
                <input type="checkbox" name="published" {% if career.published %}checked{% endif %} class="h-5 w-5 rounded border-slate-300 text-cyan-600" />
                Publish this role
            </label>
        </div>

        <div class="flex flex-wrap gap-3">
            <button type="submit" class="rounded-full bg-slate-950 px-6 py-3 text-sm font-black text-white transition hover:bg-cyan-600">
                Save Career
            </button>
            <a href="/dashboard/careers" class="rounded-full border border-slate-300 px-5 py-3 text-sm font-bold text-slate-700 transition hover:border-cyan-500 hover:text-cyan-700">
                Back to Careers
            </a>
        </div>
    </form>
</section>
