<section class="crm-hero rounded-[2rem] p-6 md:p-8">
    <div class="max-w-3xl">
        <p class="crm-hero-label">Industry Editor</p>
        <h1 class="mt-4 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
            {% if industry.title.len() > 0 %}Refine industry positioning and metadata.{% else %}Create a new industry entry for public display.{% endif %}
        </h1>
        <p class="mt-4 text-sm leading-7 text-slate-600">
            This form controls the public industries page and the featured industry highlights shown on the home page.
        </p>
    </div>
</section>

<form method="post" action="{{ action_url }}" class="mt-8 grid gap-8">
    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
        <div class="grid gap-6 lg:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Title
                <input name="title" required minlength="3" value="{{ industry.title }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Slug
                <input name="slug" value="{{ industry.slug }}" placeholder="auto-generated-from-title" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Icon Class
                <input name="icon_class" value="{{ industry.icon_class }}" placeholder="fa-solid fa-store" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Sort Order
                <input type="number" name="sort_order" value="{{ industry.sort_order }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
        </div>

        <div class="mt-6 grid gap-6">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Short Description
                <textarea name="short_description" required rows="4" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ industry.short_description }}</textarea>
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Overview
                <textarea name="overview" required rows="6" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ industry.overview }}</textarea>
            </label>
            <div class="grid gap-6 lg:grid-cols-2">
                <label class="grid gap-2 text-sm font-bold text-slate-700">
                    Challenge Focus
                    <textarea name="challenge_focus" rows="5" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ industry.challenge_focus }}</textarea>
                </label>
                <label class="grid gap-2 text-sm font-bold text-slate-700">
                    Solution Focus
                    <textarea name="solution_focus" rows="5" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ industry.solution_focus }}</textarea>
                </label>
            </div>
        </div>
    </section>

    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
        <p class="text-sm font-black uppercase tracking-[0.24em] text-slate-500">SEO</p>
        <div class="mt-6 grid gap-6 lg:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Meta Title
                <input name="meta_title" value="{{ industry.meta_title }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Canonical URL
                <input name="canonical_url" value="{{ industry.canonical_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700 lg:col-span-2">
                Meta Description
                <textarea name="meta_description" rows="4" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ industry.meta_description }}</textarea>
            </label>
            <label class="grid gap-2 text-sm font-bold text-slate-700 lg:col-span-2">
                OG Image URL
                <input name="og_image_url" value="{{ industry.og_image_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
        </div>
    </section>

    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div class="flex flex-wrap gap-6">
                <label class="inline-flex items-center gap-3 text-sm font-bold text-slate-700">
                    <input type="checkbox" name="featured" {% if industry.featured %}checked{% endif %} class="h-5 w-5 rounded border-slate-300 text-cyan-600" />
                    Featured on home page
                </label>
                <label class="inline-flex items-center gap-3 text-sm font-bold text-slate-700">
                    <input type="checkbox" name="published" {% if industry.published %}checked{% endif %} class="h-5 w-5 rounded border-slate-300 text-cyan-600" />
                    Published publicly
                </label>
            </div>

            <div class="flex flex-wrap gap-3">
                <a href="/dashboard/industries" class="rounded-full border border-slate-300 px-5 py-3 text-sm font-bold text-slate-700 transition hover:border-cyan-500 hover:text-cyan-700">
                    Back
                </a>
                <button type="submit" class="rounded-full bg-slate-950 px-6 py-3 text-sm font-black text-white transition hover:bg-cyan-600">
                    Save Industry
                </button>
            </div>
        </div>
    </section>
</form>
