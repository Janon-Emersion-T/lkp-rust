<section class="crm-hero rounded-[2rem] p-6 md:p-8">
    <div class="max-w-3xl">
        <p class="crm-hero-label">Insight Editor</p>
        <h1 class="mt-4 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
            {% if insight.title.len() > 0 %}Refine article content and metadata.{% else %}Create a publish-ready insight article.{% endif %}
        </h1>
        <p class="mt-4 text-sm leading-7 text-slate-600">
            This form controls the public insight listing, the article page, featured article placement, and the metadata search engines read.
        </p>
    </div>
</section>

<form method="post" action="{{ action_url }}" class="mt-8 grid gap-8">
    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
        <div class="grid gap-6 lg:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Title
                <input name="title" required minlength="3" value="{{ insight.title }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Slug
                <input name="slug" value="{{ insight.slug }}" placeholder="auto-generated-from-title" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Author
                <input name="author" value="{{ insight.author }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Category
                <input name="category" value="{{ insight.category }}" placeholder="SEO, Automation, AI..." class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Reading Time Minutes
                <input type="number" min="1" name="reading_time_minutes" value="{{ insight.reading_time_minutes }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Cover Image URL
                <input name="cover_image_url" value="{{ insight.cover_image_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Publish Date & Time
                <input type="datetime-local" name="published_at" value="{{ insight.published_at_local }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
                <span class="text-xs font-semibold leading-5 text-slate-500">
                    Leave blank to publish immediately when "Published publicly" is enabled. Use a future Sri Lanka time to schedule automatic publication.
                </span>
            </label>
        </div>

        <div class="mt-6 grid gap-6">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Excerpt
                <textarea name="excerpt" required rows="4" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ insight.excerpt }}</textarea>
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Content
                <textarea name="content" required rows="14" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ insight.content }}</textarea>
            </label>
        </div>
    </section>

    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
        <p class="text-sm font-black uppercase tracking-[0.24em] text-slate-500">SEO</p>
        <div class="mt-6 grid gap-6 lg:grid-cols-2">
            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Meta Title
                <input name="meta_title" value="{{ insight.meta_title }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700">
                Canonical URL
                <input name="canonical_url" value="{{ insight.canonical_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700 lg:col-span-2">
                Meta Description
                <textarea name="meta_description" rows="4" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500">{{ insight.meta_description }}</textarea>
            </label>

            <label class="grid gap-2 text-sm font-bold text-slate-700 lg:col-span-2">
                OG Image URL
                <input name="og_image_url" value="{{ insight.og_image_url }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
            </label>
        </div>
    </section>

    <section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)]">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div class="flex flex-wrap gap-6">
                <label class="inline-flex items-center gap-3 text-sm font-bold text-slate-700">
                    <input type="checkbox" name="featured" {% if insight.featured %}checked{% endif %} class="h-5 w-5 rounded border-slate-300 text-cyan-600" />
                    Featured on listings
                </label>

                <label class="inline-flex items-center gap-3 text-sm font-bold text-slate-700">
                    <input type="checkbox" name="published" {% if insight.published %}checked{% endif %} class="h-5 w-5 rounded border-slate-300 text-cyan-600" />
                    Published publicly
                </label>
            </div>

            <div class="flex flex-wrap gap-3">
                <a href="/dashboard/insights" class="rounded-full border border-slate-300 px-5 py-3 text-sm font-bold text-slate-700 transition hover:border-cyan-500 hover:text-cyan-700">
                    Back
                </a>
                <button type="submit" class="rounded-full bg-slate-950 px-6 py-3 text-sm font-black text-white transition hover:bg-cyan-600">
                    Save Insight
                </button>
            </div>
        </div>
    </section>
</form>
