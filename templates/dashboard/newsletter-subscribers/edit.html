{% extends "dashboard/base.html" %}

{% block title %}Edit Subscriber | Dashboard{% endblock %}

{% block content %}
<section class="rounded-[2rem] border border-slate-200 bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.05)] md:p-8">
    <div class="max-w-3xl">
        <p class="text-sm font-black uppercase tracking-[0.24em] text-slate-500">Newsletter Audience</p>
        <h1 class="mt-3 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">
            Edit subscriber details.
        </h1>
        <p class="mt-4 text-sm leading-7 text-slate-600">
            Keep the address and source clean so future newsletter sends stay reliable.
        </p>
    </div>

    <form action="{{ action_url }}" method="post" class="mt-8 grid max-w-3xl gap-5">
        <label class="grid gap-2 text-sm font-bold text-slate-700">
            Email address
            <input type="email" name="email" required value="{{ subscriber.email }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
        </label>

        <label class="grid gap-2 text-sm font-bold text-slate-700">
            Source
            <input name="source" value="{{ subscriber.source }}" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-950 outline-none transition focus:border-cyan-500" />
        </label>

        <div class="mt-2 flex flex-wrap gap-3">
            <button type="submit" class="rounded-full bg-slate-950 px-6 py-3 text-sm font-black text-white transition hover:bg-cyan-600">
                Update Subscriber
            </button>
            <a href="/dashboard/newsletter-subscribers" class="rounded-full border border-slate-300 px-6 py-3 text-sm font-black text-slate-700 transition hover:border-cyan-500 hover:text-cyan-700">
                Back
            </a>
        </div>
    </form>
</section>
{% endblock %}
