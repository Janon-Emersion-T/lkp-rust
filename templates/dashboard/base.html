<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Dashboard | LKProfessionals (Pvt) Ltd.
        {% endblock %}
    </title>

    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        {% include "dashboard/partials/sidebar.html" %}

        <!-- Main Area -->
        <div class="flex flex-1 flex-col lg:pl-72">

            <!-- Header -->
            {% include "dashboard/partials/header.html" %}

            <!-- Page Content -->
            <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            {% include "dashboard/partials/footer.html" %}

        </div>

    </div>

    <script>
        (() => {
            const currentPath = window.location.pathname.replace(/\/+$/, "") || "/";
            const links = document.querySelectorAll("[data-nav-match]");

            for (const link of links) {
                const href = (link.getAttribute("href") || "").replace(/\/+$/, "") || "/";
                const mode = link.getAttribute("data-nav-match");

                const isActive = mode === "exact"
                    ? currentPath === href
                    : currentPath === href || currentPath.startsWith(`${href}/`);

                if (isActive) {
                    link.classList.add("dashboard-nav-link-active");
                    link.setAttribute("aria-current", "page");
                }
            }
        })();
    </script>
</body>
</html>
