<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LKProfessionals</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4">

    <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-xl">

        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-900">
                LKProfessionals
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Admin Dashboard
            </p>
        </div>

        {% if let Some(error) = error %}
            <div class="mt-6 rounded-md bg-red-50 px-4 py-3 text-sm text-red-700">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="post" class="mt-8 space-y-5">

            <div>
                <label class="block text-sm font-semibold text-slate-700">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="admin@example.com"
                    required
                    class="mt-2 w-full rounded-md border border-slate-300 px-4 py-3 text-slate-900 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                >
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    class="mt-2 w-full rounded-md border border-slate-300 px-4 py-3 text-slate-900 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
                >
            </div>

            <label class="flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" name="remember" class="rounded border-slate-300">
                Remember me
            </label>

            <button
                type="submit"
                class="w-full rounded-md bg-blue-800 px-4 py-3 font-semibold text-white transition hover:bg-blue-900"
            >
                Sign In
            </button>

        </form>

        <div class="mt-6 border-t border-slate-200 pt-5 text-center">
            <p class="text-xs text-slate-500">
                Protected Admin Area. Authorized access only got Janon Emersion T
            </p>
        </div>

    </div>

</body>
</html>
