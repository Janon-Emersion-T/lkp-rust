<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | LKProfessionals (Pvt) Ltd.</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center px-6">

    <div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
        <h1 class="text-2xl font-bold text-slate-900">
            Dashboard Login
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            LKProfessionals (Pvt) Ltd. admin access
        </p>

        {% if let Some(error) = error %}
            <div class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="post" class="mt-6 space-y-5">
            <div>
                <label class="text-sm font-medium text-slate-700">Email</label>
                <input
                    type="email"
                    name="email"
                    required
                    class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-cyan-500"
                >
            </div>

            <div>
                <label class="text-sm font-medium text-slate-700">Password</label>
                <input
                    type="password"
                    name="password"
                    required
                    class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-cyan-500"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-xl bg-cyan-500 px-5 py-3 font-semibold text-white hover:bg-cyan-600"
            >
                Login
            </button>
        </form>
    </div>

</body>
</html>
